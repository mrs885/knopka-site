<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Telegram notification — country row variants</title>
  <link rel="stylesheet" href="row-variants.css">
</head>
<body>
  <main class="canvas" aria-label="Ряд стран">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <section class="stage">
      <article class="country country-fr"><div class="card"><div class="flag"><img src="flags/fr.svg" alt=""></div></div></article>
      <article class="country country-de"><div class="card"><div class="flag"><img src="flags/de.svg" alt=""></div></div></article>
      <article class="country country-pl"><div class="card"><div class="flag"><img src="flags/pl.svg" alt=""></div></div></article>
      <article class="country country-gb"><div class="card"><div class="flag"><img src="flags/gb.svg" alt=""></div></div></article>
      <article class="country country-nl"><div class="card"><div class="flag"><img src="flags/nl.svg" alt=""></div></div></article>
    </section>
  </main>
  <script>
    const variant = new URLSearchParams(location.search).get('variant') || 'a';
    document.body.dataset.variant = /^[a-e]$/.test(variant) ? variant : 'a';
  </script>
</body>
</html>
