<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Telegram notification — country row</title>
  <link rel="stylesheet" href="row.css">
</head>
<body>
  <main class="canvas" aria-label="Ряд стран">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <section class="stage">
      <article class="country country-fr" data-country="FR"><div class="card"><div class="flag"><img src="flags/fr.svg" alt=""></div></div></article>
      <article class="country country-de" data-country="DE"><div class="card"><div class="flag"><img src="flags/de.svg" alt=""></div></div></article>
      <article class="country country-pl" data-country="PL"><div class="card"><div class="flag"><img src="flags/pl.svg" alt=""></div></div></article>
      <article class="country country-gb" data-country="GB"><div class="card"><div class="flag"><img src="flags/gb.svg" alt=""></div></div></article>
      <article class="country country-nl" data-country="NL"><div class="card"><div class="flag"><img src="flags/nl.svg" alt=""></div></div></article>
    </section>
  </main>
</body>
</html>
